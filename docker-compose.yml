services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Vektor-Index liegt im Projektordner (nicht in einem versteckten Docker-Volume),
      # damit die vorbefüllte Wissensbasis MIT dem Projekt weitergegeben werden kann:
      # Ordner mitkopieren → `docker compose up` → Index sofort da (kein Neu-Indexieren).
      - ./qdrant_storage:/qdrant/storage

  cad_processor:
    build: ./cad_processor
    ports:
      - "8001:8001"
    volumes:
      # CAD-Quellcode live einspielen: Änderungen greifen ohne Image-Rebuild.
      - ./cad_processor/src:/app/src
    # Hängt --reload an das ENTRYPOINT-uvicorn an (Auto-Reload bei .py-Änderungen).
    command: ["--reload"]

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - cad_processor
    environment:
      # Diese Variablen schalten die (lokal eingebettete) config.yaml automatisch auf
      # den Compose-Modus: echter Qdrant-Server statt On-Disk, echter CAD-Service statt Stub.
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CAD_PROCESSOR_URL=http://cad_processor:8001
      # Ollama läuft auf dem Host (Modelle sind groß) und wird über host.docker.internal erreicht.
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      # Damit host.docker.internal auch unter Linux auf den Host zeigt (unter macOS/Windows nativ).
      - "host.docker.internal:host-gateway"
    # Überschreibt das CMD aus dem Dockerfile und aktiviert Auto-Reload.
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - hf_cache:/app/.cache/huggingface   # BGE-M3-Modell über Neustarts hinweg cachen
      - ./storage:/app/storage             # hochgeladene PDFs/STEP-Dateien persistieren
      - ./logs:/app/logs                   # Query-Logs auf dem Host einsehbar
      # --- Live-Entwicklung: Code vom Host einspielen (kein Rebuild nötig) ---
      - ./app:/app/app                     # RAG-/API-Code -> uvicorn --reload startet neu
      - ./frontend:/app/frontend           # Web-GUI -> nur Browser neu laden
      - ./prompts:/app/prompts             # Prompt-Dateien -> Server manuell neu starten

volumes:
  hf_cache:
