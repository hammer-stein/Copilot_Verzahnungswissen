services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  cad_processor:
    build: ./cad_processor
    ports:
      - "8001:8001"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - cad_processor
    environment:
      - QDRANT_HOST=qdrant
      - CAD_PROCESSOR_URL=http://cad_processor:8001
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ./config.yaml:/app/config.yaml:ro

volumes:
  qdrant_data:
