# =============================================================================
# HAUPTKONFIGURATION – KI-Copilot für Wissensbasis
# =============================================================================
#
# DOMÄNE WECHSELN (z.B. auf Obstbäume):
#   1. domain.name        → sprechender Name der Domäne (erscheint im LLM-Prompt)
#   2. domain.prompt_path → Systemprompt-Vorlage für den Antwortgenerator
# =============================================================================

domain:
  name: "Verzahnungen"
  prompt_path: "prompts/answer_system_prompt.txt"

# =============================================================================
# EMBEDDER – Vektorisierungsmodell
# =============================================================================
# device: "mps" für Apple Silicon, "cuda" für NVIDIA GPU, "cpu" als Fallback
# use_sparse: true wird für Hybrid-Retrieval benötigt (lexikalischer Sparse-Kanal).
#   ACHTUNG: Nach Umstellung von use_sparse müssen Dokumente neu indexiert werden,
#   da bestehende Qdrant-Punkte sonst keine Sparse-Vektoren tragen.
# =============================================================================

embedder:
  implementation: "bge_m3"
  model_name: "BAAI/bge-m3"
  device: "cpu"          # ÄNDERUNG: "cpu" | "cuda" | "mps"
  use_sparse: true       # ÄNDERUNG: false nur ohne Hybrid-Retrieval; nach Umstellung Dokumente neu indexieren
  max_length: 8192
  batch_size: 16         # Chunks pro Embedding-Batch; größer = schnellere (Massen-)Uploads, mehr RAM

# =============================================================================
# CHUNKER – Textsegmentierung
# =============================================================================
# implementation: "recursive" (schnell, regelbasiert) oder "semantic" (Embedding-gestützt)
# =============================================================================

chunker:
  implementation: "recursive"   # ÄNDERUNG: "semantic" für semantischen Chunker
  threshold: 0.5
  min_chunk_size: 100
  max_chunk_size: 512
  overlap_sentences: 1

# =============================================================================
# CAD-ADAPTER – Schalter: synthetische Test-JSONs oder echte STEP-Analyse
# =============================================================================
# "synthetic_json"     = /cad/analyze liefert synthetische Testdatensätze aus
#                        synthetic_data_dir (kein cad_processor-Service nötig)
# "cad_processor_local" = /cad/analyze ruft den cad_processor direkt im Port-8000-Prozess auf
#                        (kein Port 8001; Server muss im conda-Env gear-copilot laufen)
# "cad_processor_http" = STEP-Dateien werden an den cad_processor (Port 8001)
#                        geschickt und echt analysiert
# /cad/random und /cad/examples nutzen immer die synthetischen Datensätze.
# =============================================================================

cad_adapter:
  implementation: "cad_processor_local"   # ÄNDERUNG: "synthetic_json" für Demo oder "cad_processor_http" für separaten CAD-Service
  url: "http://localhost:8001"
  timeout_s: 120
  synthetic_data_dir: "test_verzahnung/cad_testdaten"

# =============================================================================
# VEKTORDATENBANK – Qdrant
# =============================================================================
# Standard: eingebetteter On-Disk-Modus ohne zusätzlichen Qdrant-Server.
# Für einen externen Qdrant-Server `path` auskommentieren und host/port setzen.
# =============================================================================

vector_store:
  implementation: "qdrant"
  path: "storage/qdrant"
  host: "localhost"
  port: 6333
  collection_name: "knowledge_base"  # ÄNDERUNG: Domänen-spezifischer Name empfohlen

# =============================================================================
# RETRIEVER – Hybrid-Suche (Dense + lexikalisch Sparse)
# =============================================================================
# min_similarity: Minimale Kosinus-Ähnlichkeit für Treffer (0.0–1.0)
#   Reduzieren (z.B. 0.40) wenn zu wenige Treffer gefunden werden
# use_hybrid: kombiniert Dense-Score mit lexikalischem Sparse-Score –
#   benötigt embedder.use_sparse: true. Der Sparse-Kanal liefert exakte
#   Treffer für IDs (z.B. W-103), Normnummern und Werkstoffcodes.
#   ACHTUNG: Nach Aktivierung müssen Dokumente neu indexiert werden.
# candidate_multiplier: Anzahl Dense-Kandidaten = top_k * multiplier
#   (nur bei Hybrid relevant, vor dem Sparse-Reranking)
#
# Tabellen-Routing (Split Search) – zwei Routen heben die starre top_k-Grenze auf:
# table_min_similarity: eigener, niedrigerer Threshold NUR für Tabellenzeilen
#   (doc_kind == "table"); Embeddings von Tabellendaten erzielen systembedingt
#   niedrigere Scores als Fließtext. min_similarity gilt unverändert für PDFs.
# aggregate_max_chunks: Route 1 (Signalwörter "zeige alle", "wie viele" …):
#   die bestplatzierte Tabelle wird komplett geladen, gedeckelt auf diesen Wert.
# auto_table_context_rows: Route 2 (ergebnisgetrieben, ohne Signalwort):
#   stammt die Mehrheit der Top-Treffer aus derselben Tabelle und hat diese
#   höchstens so viele Zeilen, wird sie ebenfalls komplett geladen (0 = aus).
# =============================================================================

retriever:
  top_k: 5
  min_similarity: 0.4   # Dense-Kosinus-Schwelle Fließtext (BGE-M3 relevante Treffer ~0.42–0.62).
  table_min_similarity: 0.3   # Tabellenzeilen scoren systembedingt niedriger.
  use_hybrid: true
  hybrid_dense_weight: 0.7
  hybrid_sparse_weight: 0.3
  candidate_multiplier: 8
  aggregate_max_chunks: 150
  auto_table_context_rows: 40

# =============================================================================
# ANTWORTGENERATOR – LLM-basierte Antwortgenerierung
# =============================================================================
# model_name: Für gute Antwortqualität 8b-Modell oder größer empfohlen
#
# implementation:
#   "multi_agent"  = leichtgewichtiger Fluss Orchestrator → Solver → Reviewer (Standard).
#                    Der Solver entwirft eine Antwort, der Reviewer prüft sie auf
#                    Quellendeckung/Plausibilität; der nachvollziehbare Lösungsweg wird als
#                    agent_trace zurückgegeben und im Frontend angezeigt (Prüfbarkeit).
#                    Pro Frage 2 (–3) LLM-Calls → höhere Latenz; ggf. timeout_s erhöhen.
#                    Bei jedem Fehler automatischer Fallback auf den Single-Pass.
#   "llama_ollama" = klassischer Single-Pass (genau ein LLM-Call, kein agent_trace).
# =============================================================================

answer_generator:
  implementation: "multi_agent"   # ÄNDERUNG: "llama_ollama" für klassischen Single-Pass
  model_name: "qwen3:8b"        # stark bei Deutsch + Instruktionstreue; Alternativen: "llama3.1:8b", "llama3.2:3b" (schwache Rechner)
  think: false                  # Reasoning-Modus (qwen3 & Co.) AUS – Denkspuren vervielfachen die Latenz.
                                # Bei Modellen ohne Reasoning (llama3.1/3.2) wird der Parameter automatisch ignoriert.
  ollama_url: "http://localhost:11434"
  timeout_s: 180
  max_tokens: 1200
  temperature: 0.2
  # --- nur für implementation: "multi_agent" ---
  solver_prompt_path: "prompts/solver_prompt.txt"
  reviewer_prompt_path: "prompts/reviewer_prompt.txt"
  enable_review: true       # false = nur Solver (1 LLM-Call, kein Review)
  max_revisions: 1          # max. Solver-Revisionen, wenn der Reviewer ohne Korrektur beanstandet (0 = aus)
  review_temperature: 0.0   # Reviewer streng/deterministisch

frontend:
  default_question_fields: 3
  max_question_fields: 6
  show_metadata_panel: true

# =============================================================================
# TYP-ABGLEICH – Frage nennt anderen Zahnradtyp als das geladene CAD-Bauteil
# =============================================================================
# mode (greift erst ab high_confidence):
#   "follow_cad" = Antwort für den TATSÄCHLICH geladenen CAD-Typ, mit Abweichungshinweis
#   "ask_back"   = Rückfrage statt Sachantwort (Frage muss präzisiert neu gestellt werden)
# Unter low_confidence: keine Warnung. Dazwischen: Warnung + Antwort wie gefragt.
# =============================================================================

part_match:
  mode: "follow_cad"     # ÄNDERUNG: "ask_back" für Rückfrage statt CAD-Typ-Antwort
  high_confidence: 0.85
  low_confidence: 0.5
