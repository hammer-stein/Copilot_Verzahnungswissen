<!-- @dsCard group="Brand" viewport="700x180" name="Logo & Mark" subtitle="Original product gear mark + wordmark. Not the KIT institutional logo." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:0;font-family:var(--font-sans);display:flex}
  .light{flex:1;padding:22px;display:flex;flex-direction:column;gap:18px;justify-content:center}
  .dark{flex:1;background:var(--neutral-900);padding:22px;display:flex;flex-direction:column;gap:18px;justify-content:center}
  .lock{display:flex;align-items:center;gap:12px}
  .wm{font-size:17px;font-weight:700;letter-spacing:-0.2px}
  .wm .a{color:var(--accent)}
  .sub{font-size:10px;letter-spacing:0.6px;font-weight:500;text-transform:uppercase}
  .row{display:flex;gap:14px;align-items:center}
</style></head>
<body>
  <div class="light">
    <div class="row">
      <img src="../assets/logo-mark.svg" width="40" height="40">
      <div>
        <div class="wm" style="color:var(--neutral-900)">Verzahnungs<span class="a">-Copilot</span></div>
        <div class="sub" style="color:var(--text-muted)">Verzahnungswissen · KIT</div>
      </div>
    </div>
  </div>
  <div class="dark">
    <div class="row">
      <img src="../assets/logo-mark.svg" width="40" height="40">
      <div>
        <div class="wm" style="color:#fff">Verzahnungs<span class="a" style="color:var(--green-300)">-Copilot</span></div>
        <div class="sub" style="color:#8b9593">Verzahnungswissen · KIT</div>
      </div>
    </div>
  </div>
</body></html>
