<!-- @dsCard group="Colors" viewport="700x150" name="Brand — KIT Green" subtitle="The single accent. Actions, active states, focus, citations." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
  .sw span{font-family:var(--font-mono);font-size:10px;color:#fff;mix-blend-mode:difference}
  .lbl{display:flex;gap:0;margin-top:6px}
  .lbl div{flex:1;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);padding:0 8px}
  .star{outline:2px solid var(--neutral-900);outline-offset:-2px}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--green-50)"><span style="color:#04221d;mix-blend-mode:normal">50</span></div>
    <div class="sw" style="background:var(--green-100)"><span style="color:#04221d;mix-blend-mode:normal">100</span></div>
    <div class="sw" style="background:var(--green-300)"><span>300</span></div>
    <div class="sw star" style="background:var(--green-500)"><span>500</span></div>
    <div class="sw" style="background:var(--green-600)"><span>600</span></div>
    <div class="sw" style="background:var(--green-700)"><span>700</span></div>
    <div class="sw" style="background:var(--green-900)"><span>900</span></div>
  </div>
  <div class="lbl">
    <div>#e0f5f1</div><div>#b8e9e0</div><div>#4dc4b2</div><div style="color:var(--accent-text);font-weight:600">#009682 ◆</div><div>#007e6e</div><div>#00665a</div><div>#033b35</div>
  </div>
</body></html>
