<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Anthracite" subtitle="Text, surfaces and hairline borders. Slightly cool ramp." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:64px;border:1px solid var(--border-subtle)}
  .lbl{display:flex;gap:0;margin-top:6px}
  .lbl div{flex:1;font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);text-align:center}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--neutral-0)"></div>
    <div class="sw" style="background:var(--neutral-50)"></div>
    <div class="sw" style="background:var(--neutral-100)"></div>
    <div class="sw" style="background:var(--neutral-200)"></div>
    <div class="sw" style="background:var(--neutral-300)"></div>
    <div class="sw" style="background:var(--neutral-400)"></div>
    <div class="sw" style="background:var(--neutral-500)"></div>
    <div class="sw" style="background:var(--neutral-600)"></div>
    <div class="sw" style="background:var(--neutral-700)"></div>
    <div class="sw" style="background:var(--neutral-800)"></div>
    <div class="sw" style="background:var(--neutral-900)"></div>
  </div>
  <div class="lbl">
    <div>0</div><div>50</div><div>100</div><div>200</div><div>300</div><div>400</div><div>500</div><div>600</div><div>700</div><div>800</div><div>900</div>
  </div>
</body></html>
