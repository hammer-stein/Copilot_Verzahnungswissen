<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid — dense but breathable." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:18px 22px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
  .row{display:flex;align-items:flex-end;gap:14px;height:72px}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--accent);width:18px;border-radius:var(--radius-xs)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span>2</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span>4</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span>8</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span>12</span></div>
    <div class="item"><div class="bar" style="height:20px"></div><span>16</span></div>
    <div class="item"><div class="bar" style="height:28px"></div><span>20</span></div>
    <div class="item"><div class="bar" style="height:34px"></div><span>24</span></div>
    <div class="item"><div class="bar" style="height:44px"></div><span>32</span></div>
    <div class="item"><div class="bar" style="height:54px"></div><span>40</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span>48</span></div>
  </div>
</body></html>
