<!-- @dsCard group="Type" viewport="700x130" name="Overlines & Weights" subtitle="Uppercase section labels; weight ramp 400–700." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:18px 22px;font-family:var(--font-sans);display:flex;gap:40px;align-items:center;flex-wrap:wrap}
  .over{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-muted);font-weight:600}
  .w span{display:block;font-size:18px;color:var(--text-strong);padding:1px 0}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div>
    <div class="over">BAUTEILDATEN</div>
    <div class="over" style="margin-top:8px">WISSENSBASIS · 12 DOKUMENTE</div>
    <div class="lbl" style="margin-top:8px">overline · 12px · 0.06em · uppercase</div>
  </div>
  <div class="w">
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">Semibold 600</span>
    <span style="font-weight:700">Bold 700</span>
  </div>
</body></html>
