<!-- @dsCard group="Colors" viewport="700x150" name="Citation & States" subtitle="Source-highlight wash, active and hover surfaces." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);font-size:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .cite{background:var(--citation-bg);color:var(--citation-text);border:1px solid var(--citation-border);border-radius:var(--radius-xs);padding:2px 6px;font-family:var(--font-mono);font-size:11px;font-weight:600}
  .box{border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 12px;font-size:11px;color:var(--text-body)}
  .active{background:var(--surface-active);border-color:var(--accent);color:var(--accent-text);font-weight:600}
  .hover{background:var(--surface-hover)}
</style></head>
<body>
  <span class="cite">[Q1]</span>
  <span class="cite">[Q2]</span>
  <div class="box active">Aktiv / ausgewählt</div>
  <div class="box hover">Hover-Fläche</div>
  <div class="box">Standard</div>
</body></html>
