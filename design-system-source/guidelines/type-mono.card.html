<!-- @dsCard group="Type" viewport="700x180" name="Mono — Parameters & Code" subtitle="JetBrains Mono. Tabular figures for gear data, formulas, JSON." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:16px 22px;font-family:var(--font-mono);font-size:12px;color:var(--text-body)}
  .well{background:var(--surface-sunken);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.7}
  .k{color:var(--text-muted)}
  .n{color:var(--blue-500);font-weight:500}
  .s{color:var(--green-700)}
  table{border-collapse:collapse;margin-top:10px;font-size:11.5px}
  td{padding:2px 14px 2px 0;font-variant-numeric:tabular-nums}
  td:first-child{color:var(--text-muted)}
</style></head>
<body>
  <div class="well"><span class="k">modul</span>: <span class="n">2.5</span>  <span class="k">zaehnezahl</span>: <span class="n">34</span>  <span class="k">eingriffswinkel</span>: <span class="n">20.0</span>°<br>
  <span class="k">werkstoff</span>: <span class="s">"16MnCr5"</span>  <span class="k">qualität</span>: <span class="n">7</span></div>
  <table>
    <tr><td>Teilkreis d</td><td style="text-align:right">85.000</td><td>mm</td></tr>
    <tr><td>Kopfkreis dₐ</td><td style="text-align:right">90.000</td><td>mm</td></tr>
    <tr><td>Fußkreis d_f</td><td style="text-align:right">78.750</td><td>mm</td></tr>
  </table>
</body></html>
