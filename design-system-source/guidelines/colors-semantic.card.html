<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Feedback" subtitle="Meaning only: blue=info/data, amber=warning/tolerance, red=out-of-spec." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .item{display:flex;flex-direction:column;gap:6px}
  .chip{height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:600;font-size:11px}
  .soft{height:20px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600}
  .name{font-size:11px;color:var(--text-strong);font-weight:600}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div class="grid">
    <div class="item"><div class="chip" style="background:var(--success)">Success</div><div class="soft" style="background:var(--success-soft);color:var(--green-700)">soft</div><div class="hex">--success</div></div>
    <div class="item"><div class="chip" style="background:var(--info)">Info</div><div class="soft" style="background:var(--info-soft);color:var(--blue-600)">soft</div><div class="hex">--info · #2f6fb0</div></div>
    <div class="item"><div class="chip" style="background:var(--warning)">Warnung</div><div class="soft" style="background:var(--warning-soft);color:var(--amber-600)">soft</div><div class="hex">--warning · #c8820e</div></div>
    <div class="item"><div class="chip" style="background:var(--danger)">Fehler</div><div class="soft" style="background:var(--danger-soft);color:var(--red-600)">soft</div><div class="hex">--danger · #c63a2e</div></div>
  </div>
</body></html>
